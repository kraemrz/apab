services:
  minio:
    image: minio/minio:latest
    container_name: apab-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  app:
    build: .
    container_name: apab-app
    ports:
      - "5000:8000"
    environment:
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_SECURE=false
    depends_on:
      - minio
    volumes:
      - .:/app

volumes:
  minio_data: